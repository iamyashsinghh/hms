# The stack's single entry point (host port 4001 by default):
#   /api/  -> API      /db/ -> Adminer (database viewer)      everything else -> web
# Upstreams are resolved through Docker's DNS on each request, so restarting a container never
# leaves the proxy pointing at an old address.
resolver 127.0.0.11 valid=10s ipv6=off;

# Keep the scheme the outer proxy (nginx + certbot on the host) saw, so the API knows when the
# browser is on HTTPS and marks its cookies Secure.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_tokens off;
  client_max_body_size 20m;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $http_connection;
  proxy_read_timeout 120s;

  set $api http://api:4000;
  set $web http://web:3000;
  set $adminer http://adminer:8080;

  location /api/ {
    proxy_pass $api;
  }

  location = /db {
    return 301 /db/;
  }
  location /db/ {
    proxy_pass $adminer;
  }

  location / {
    proxy_pass $web;
  }
}
